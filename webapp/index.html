<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e1621">
<title>Мини-игры</title>
<link rel="stylesheet" href="app.css?v=2">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<header id="topbar">
  <button id="back" class="icon-btn" hidden aria-label="Назад">‹</button>
  <div id="title">Мини-игры</div>
  <button id="layout-toggle" class="icon-btn ghost" aria-label="Переключить раскладку" title="Мобильная раскладка">▭</button>
  <div id="pumpkins" class="coins pumpkins" hidden>🎃 0</div>
  <div id="coins" class="coins">🪙 —</div>
</header>

<main id="screen"></main>

<nav id="tabs" class="tabs">
  <button data-tab="games"><span>🎮</span>Игры</button>
  <button data-tab="profile"><span>👤</span>Профиль</button>
  <button data-tab="shop"><span>🛒</span>Магазин</button>
  <button data-tab="season"><span>⭐</span>Сезон</button>
</nav>

<div id="toast" class="toast" hidden></div>

<script src="app.js?v=2"></script>
</body>
</html>
