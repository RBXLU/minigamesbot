<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14171c">
<title>Мини-игры</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
<link rel="stylesheet" href="app.css?v=7">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<header id="topbar">
  <button id="back" class="icon-btn" hidden aria-label="Назад"><i class="fa-solid fa-chevron-left"></i></button>
  <div id="title">Мини-игры</div>
  <button id="settings-btn" class="icon-btn ghost" aria-label="Настройки" title="Настройки"><i class="fa-solid fa-gear"></i></button>
  <div id="pumpkins" class="coins pumpkins" hidden>🎃 0</div>
  <div id="coins" class="coins">🪙 —</div>
</header>

<main id="screen">
  <div class="splash"><div class="splash-art">🎲</div>Раскладываем игры…</div>
</main>

<nav id="tabs" class="tabs">
  <button data-tab="games"><i class="fa-solid fa-gamepad"></i>Игры</button>
  <button data-tab="profile"><i class="fa-solid fa-user"></i>Профиль</button>
  <button data-tab="shop"><i class="fa-solid fa-bag-shopping"></i>Лавка</button>
  <button data-tab="season"><i class="fa-solid fa-star"></i>Сезон</button>
</nav>

<div id="toast" class="toast" hidden></div>

<script src="app.js?v=7"></script>
</body>
</html>
